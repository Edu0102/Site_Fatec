<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Inicial</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/paginas.css">
    <script src="js/menu-usuario.js"></script>
    <script src="js/header.js" defer></script>
</head>
<body>
    <header class="header-padrao">
        <div class="header-logo">
            <span class="logo-circulo">LOGO</span>
            <span class="logo-texto">F.R.Cont<br>(logo)</span>
        </div>

        <h1 class="header-titulo">Hub Inicial</h1>

        <div class="header-usuario" id="header-usuario">
            <button type="button" class="usuario-botao" id="usuario-botao" aria-haspopup="true" aria-expanded="false" aria-controls="usuario-menu">
                <span class="avatar" id="usuario-foto"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5Z"/></svg></span>
                <span class="usuario-nome" id="usuario-nome">Nome do funcionário</span>
                <svg class="usuario-seta" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg>
            </button>
            <ul class="usuario-menu" id="usuario-menu" hidden>
                <li><button type="button" id="menu-tema">Tema escuro</button></li>
                <li><a href="html/guia.html">Guia</a></li>
                <li><a href="html/feedback.html">Feedback</a></li>
                <li class="menu-separado"><a class="menu-sair" id="menu-sair" href="login.html">Logout</a></li>
            </ul>
        </div>
    </header>

    <main class="container hub">
        <div class="grupos-wrapper">

            <!-- Grupo esquerdo -->
            <div class="card-grupo">
                <a href="html/checklist.html" class="quadrado">
                    <i class="bi bi-card-checklist icone" aria-hidden="true"></i>
                    <span>Checklist</span>
                </a>
                <a href="html/centrallink.html" class="quadrado">
                    <i class="bi bi-link-45deg icone" aria-hidden="true"></i>
                    <span>Central Links</span>
                </a>
            </div>

            <!-- Grupo direito -->
            <div class="card-grupo">
                <a href="html/centralpop.html" class="quadrado">
                    <i class="bi bi-file-earmark-text icone" aria-hidden="true"></i>
                    <span>POP's</span>
                </a>
                <a href="html/guia.html" class="quadrado">
                    <i class="bi bi-journal-bookmark icone" aria-hidden="true"></i>
                    <span>Guia</span>
                </a>
            </div>

        </div>

        <!-- Botão de feedback inferior -->
        <a href="html/feedback.html" class="button button-primary btn-feedback">
            <i class="bi bi-chat-dots" aria-hidden="true"></i>
            Feedback
        </a>
    </main>

</body>
</html>
