<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="../css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <script src="../js/header.js" defer></script>
</head>
<body class="page-feedback">
        <main>
        <a class="voltar" href="../index.html">Voltar ao hub inicial</a>
        <br>
        <form class="formulario">
            <h2>Gostaria de sugerir alguma mudança ou adição?</h2>

            <label for="assunto">Assunto</label>
            <input type="text" id="assunto" name="assunto" required>

            <label for="motivo">Motivo e Função</label>
            <textarea id="motivo" name="motivo"
                placeholder="Digite aqui..." required></textarea>

            <button type="submit">Enviar</button>
        </form>
    </main>
</body>
</html>
