<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Links</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/paginas.css">
    <script src="../js/menu-usuario.js"></script>
    <script src="../js/header.js" defer></script>
    <script src="../js/centrallink.js" defer></script>
</head>
<body>
    <header class="header-padrao">
        <div class="header-logo">
            <span class="logo-circulo">LOGO</span>
            <span class="logo-texto">F.R.Cont<br>(logo)</span>
        </div>

        <h1 class="header-titulo">Central de Links</h1>

        <div class="header-usuario" id="header-usuario">
            <button type="button" class="usuario-botao" id="usuario-botao" aria-haspopup="true" aria-expanded="false" aria-controls="usuario-menu">
                <span class="avatar" id="usuario-foto"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5Z"/></svg></span>
                <span class="usuario-nome" id="usuario-nome">Nome do funcionário</span>
                <svg class="usuario-seta" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg>
            </button>
            <ul class="usuario-menu" id="usuario-menu" hidden>
                <li><button type="button" id="menu-tema">Tema escuro</button></li>
                <li><a href="guia.html">Guia</a></li>
                <li><a href="feedback.html">Feedback</a></li>
                <li class="menu-separado"><a class="menu-sair" id="menu-sair" href="../login.html">Logout</a></li>
            </ul>
        </div>
    </header>

    <main class="container">
        <a class="botao-voltar" href="../index.html">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m6-6-6 6 6 6"/></svg>
            Voltar ao hub
        </a>

        <div class="pesquisa">
            <input type="search" id="pesquisa" placeholder="Pesquisar links..." aria-label="Pesquisar links" oninput="filtrarLinks()">
        </div>

        <div class="conteudo">

            <aside class="filtros-lateral">
                <h3>Filtros padrões</h3>
                <div id="filtros"></div>
            </aside>

            <section>
                <div class="acoes">
                    <button type="button" class="button button-primary" onclick="mostrarFormulario()">+ Adicionar link</button>
                </div>

                <form id="formulario" class="form-stack panel">
                    <h3>Adicionar novo link</h3>

                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" required>

                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" required></textarea>

                    <label for="url">Endereço do link</label>
                    <input type="url" id="url" placeholder="https://..." required>

                    <label for="assunto">Assunto</label>
                    <input type="text" id="assunto" placeholder="Ex.: Certidões" required>

                    <label for="tags">Tags</label>
                    <input type="text" id="tags" placeholder="Ex.: Federal, Consulta Pública" required>

                    <div class="form-actions">
                        <button type="submit" class="button button-primary">Salvar link</button>
                        <button type="button" class="button button-light" onclick="mostrarFormulario()">Cancelar</button>
                    </div>
                </form>

                <div id="mensagem"></div>
                <div id="listaLinks"></div>
            </section>

        </div>
    </main>

</body>
</html>
