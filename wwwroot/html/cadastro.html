<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #101827, #253b67);
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 15px 40px #0005;
        }

        .icone {
            font-size: 35px;
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #315bd6;
            box-shadow: 0 0 0 3px #315bd620;
        }

        /* Campo de senha e botão Mostrar */
        .senha {
            display: flex;
            gap: 5px;
            align-items: flex-start;
            margin-bottom: 18px;
        }

        .senha input {
            flex: 1;
            min-width: 0;
            margin-bottom: 0;
        }

        .mostrar {
            height: 44px;
            padding: 0 10px;
            border: 1px solid #ddd;
            border-radius: 9px;
            background: #f4f6fa;
            cursor: pointer;
            font-size: 14px;
            color: #222;
            white-space: nowrap;
        }

        .mostrar:hover {
            background: #e9edf5;
        }

        button.cadastrar {
            width: 100%;
            padding: 14px;
            background: #315bd6;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button.cadastrar:hover {
            background: #2446ae;
        }

        #mensagem {
            margin-top: 18px;
            margin-bottom: 0;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icone">👤</div>

        <h1>Criar conta</h1>

        <p>Preencha os dados para se cadastrar.</p>

        <form id="formCadastro">

            <label for="nome">Nome completo</label>
            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                autocomplete="name"
                required
            >

            <label for="email">E-mail / id</label>
            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail / id"
                autocomplete="email"
                required
            >

            <label for="senha">Senha</label>

            <div class="senha">
                <input
                    type="password"
                    id="senha"
                    placeholder="Mínimo de 6 caracteres"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="mostrar"
                    onclick="alternarSenha('senha', this)"
                    aria-label="Mostrar senha"
                >Mostrar</button>
            </div>

            <label for="confirmar">Confirmar senha</label>

            <div class="senha">
                <input
                    type="password"
                    id="confirmar"
                    placeholder="Digite a senha novamente"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="mostrar"
                    onclick="alternarSenha('confirmar', this)"
                    aria-label="Mostrar confirmação da senha"
                >Mostrar</button>
            </div>

            <button type="submit" class="cadastrar">
                Cadastrar
            </button>

        </form>

        <p id="mensagem" role="status" aria-live="polite"></p>

    </div>

    <script>
        // Mostrar ou esconder a senha
        function alternarSenha(id, botao) {
            var campoSenha = document.getElementById(id);

            if (campoSenha.type === "password") {
                campoSenha.type = "text";
                botao.textContent = "Esconder";
                botao.setAttribute("aria-label", "Esconder senha");
            } else {
                campoSenha.type = "password";
                botao.textContent = "Mostrar";
                botao.setAttribute("aria-label", "Mostrar senha");
            }
        }

        // Verificar os dados do cadastro
        document.getElementById("formCadastro").onsubmit = function(event) {
            event.preventDefault();

            var senha = document.getElementById("senha").value;
            var confirmar = document.getElementById("confirmar").value;
            var mensagem = document.getElementById("mensagem");

            if (senha !== confirmar) {
                mensagem.style.color = "#d93025";
                mensagem.textContent = "As senhas não são iguais!";
            } else {
                mensagem.style.color = "#d93025";
                mensagem.textContent =
                    "O banco de dados ainda não está em funcionamento.";
            }
        };
    </script>

</body>
</html>
