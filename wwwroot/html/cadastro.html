<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #101827, #253b67);
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 15px 40px #0005;
        }

        .icone {
            font-size: 35px;
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 9px;
            margin-bottom: 18px;
        }

        input:focus {
            outline: none;
            border-color: #315bd6;
        }

        .mostrar-senha {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: -10px;
            margin-bottom: 18px;
            font-size: 13px;
            font-weight: normal;
            cursor: pointer;
        }

        .mostrar-senha input {
            width: auto;
            margin: 0;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #315bd6;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2446ae;
        }

        #mensagem {
            margin-top: 18px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icone">👤</div>

        <h1>Criar conta</h1>

        <p>Preencha os dados para se cadastrar.</p>

        <form id="formCadastro">

            <label for="nome">Nome completo</label>
            <input type="text" id="nome"
                placeholder="Digite seu nome" required>

            <label for="email">E-mail / id</label>
            <input type="email" id="email"
                placeholder="Digite seu e-mail / id" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha"
                placeholder="Mínimo de 6 caracteres"
                minlength="6" required>

            <label class="mostrar-senha">
                <input type="checkbox" id="mostrarSenha">
                Mostrar senha
            </label>

            <label for="confirmar">Confirmar senha</label>
            <input type="password" id="confirmar"
                placeholder="Digite a senha novamente"
                minlength="6" required>

            <label class="mostrar-senha">
                <input type="checkbox" id="mostrarConfirmar">
                Mostrar senha
            </label>

            <button type="submit">Cadastrar</button>

        </form>

        <p id="mensagem"></p>

    </div>

    <script>
        // Mostrar ou ocultar a senha
        document.getElementById("mostrarSenha").onchange = function() {
            document.getElementById("senha").type =
                this.checked ? "text" : "password";
        };

        // Mostrar ou ocultar a confirmação da senha
        document.getElementById("mostrarConfirmar").onchange = function() {
            document.getElementById("confirmar").type =
                this.checked ? "text" : "password";
        };

        document.getElementById("formCadastro").onsubmit = function(event) {
            event.preventDefault();

            var senha = document.getElementById("senha").value;
            var confirmar = document.getElementById("confirmar").value;
            var mensagem = document.getElementById("mensagem");

            if (senha != confirmar) {
                mensagem.style.color = "red";
                mensagem.innerHTML = "As senhas não são iguais!";
            } else {
                mensagem.style.color = "red";
                mensagem.innerHTML =
                    "O banco de dados ainda não está em funcionamento";
            }
        };
    </script>

</body>
</html>
